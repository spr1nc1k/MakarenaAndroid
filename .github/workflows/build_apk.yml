name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.7
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK Output
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Makarena.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/WhiteWeb.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Makarena-Android-APK
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0
          name: "WhiteWeb Android v1.3.0"
          files: |
            dist/WhiteWeb.apk
            dist/Makarena.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
